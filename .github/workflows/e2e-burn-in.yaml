name: E2E burn-in

# Measures the real flake rate of the `e2e-android` suite by running it N times
# in a row on one warm emulator.
#
# Why nightly and not per-PR: one iteration is ~14 min, so a 5x burn-in on every
# PR would be unusable. The point is not to gate a change — it is to produce the
# number that says whether `e2e-android` is trustworthy enough to become a
# required status check on master. Epic 1 retro action item #2.
#
# Read the tally at the end of the job log. Target before making the job
# required: 0 failures across 10 consecutive iterations.

on:
  schedule:
    # 05:00 UTC = 02:00 BRT — after the day's merges, before the next session.
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      iterations:
        description: "How many times to run the suite"
        required: false
        default: "5"

jobs:
  burn-in:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.x
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache AVD snapshot
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api35-pixel6-x86_64

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot generated"

      - name: Burn-in
        uses: reactivecircus/android-emulator-runner@v2
        # `inputs.*` is user-controlled: it reaches the shell only through an
        # env var, quoted, and is validated as an integer before use. Never
        # interpolate it into the script body.
        env:
          ITERATIONS: ${{ github.event.inputs.iterations || '5' }}
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            case "$ITERATIONS" in
              ''|*[!0-9]*) echo "iterations must be a positive integer, got: $ITERATIONS"; exit 1 ;;
            esac
            pass=0
            fail=0
            for i in $(seq 1 "$ITERATIONS"); do
              echo "::group::burn-in iteration $i/$ITERATIONS"
              if flutter test integration_test; then
                pass=$((pass + 1))
                echo "iteration $i: PASS"
              else
                fail=$((fail + 1))
                echo "iteration $i: FAIL"
              fi
              echo "::endgroup::"
            done
            echo "burn-in tally: $pass passed, $fail failed, out of $ITERATIONS"
            [ "$fail" -eq 0 ]
