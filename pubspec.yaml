name: catear
description: "CatEar — relative-ear training app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management (codegen) — pinned by Epic 1 stack
  flutter_riverpod: 3.4.2
  # annotation/generator packages version independently; 4.0.6 depends on riverpod 3.4.2
  riverpod_annotation: 4.0.6

  # Local database — pinned by Epic 1 stack
  drift: 2.34.3
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # Audio — pinned by Epic 1 stack (not used in this story)
  record: 7.1.1
  just_audio: 0.10.6
  # Already in the tree as a just_audio transitive dep; promoted to direct
  # because lib/audio/ configures the session itself (iOS needs the category
  # set before play() or playback is silent / mixes wrong).
  audio_session: 0.2.4

  uuid: ^4.0.0

  # Zone-scoped clock so reaction-time measurement is driven by fake_async /
  # flutter_test's fake clock in tests (Epic 1: "fake_async nos testes com
  # relógio"). Dart-team micro-package, already in the tree via fake_async.
  clock: ^1.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  build_runner: ^2.4.0
  riverpod_generator: ^4.0.6
  drift_dev: 2.34.3
  analyzer: ^13.0.0
  flutter_lints: ^6.0.0
  # Virtual clock for time-dependent tests (no wall-clock waits).
  fake_async: ^1.3.3

flutter:
  uses-material-design: true

  assets:
    - assets/curriculum/catalog_v1.json
    # Pre-rendered audio samples: 22 mono .wav files (alto sax, University of
    # Iowa MIS) — 14 single notes plus 8 mixed triad blocks, one per
    # audioSampleRef in catalog_v1.json. Provenance, license and the one-off
    # conversion recipe: docs/audio/samples-v1.md (Stories 1.3b / 1.4b).
    - assets/audio/

  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Regular.ttf
        - asset: assets/fonts/Fredoka-Medium.ttf
          weight: 500
        - asset: assets/fonts/Fredoka-SemiBold.ttf
          weight: 600
